<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="3600">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>METEO!</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #0d1117; color: #c9d1d9; font-family: -apple-system, sans-serif; overflow: hidden; 
        }
        
        /* Pārkārtots vertikālais Grid: Pulkstenis, Radari (lieli), Windy grafiks, Yr.no grafiks */
        .dashboard-container {
            display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 60px 2.5fr 1fr 1fr; 
            gap: 15px; padding: 15px; height: calc(100vh - 110px); box-sizing: border-box;
        }
        
        .widget-box {
            background-color: #161b22; border-radius: 10px; border: 1px solid #30363d;
            overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .widget-box h2 {
            margin: 0; padding: 12px 15px; font-size: 1.2rem; font-weight: bold; border-bottom: 1px solid #30363d;
            background-color: #21262d; display: flex; justify-content: space-between; align-items: center; color: #58a6ff;
        }
        
        /* Pozīcijas */
        .clock-bar { grid-column: 1 / 3; grid-row: 1 / 2; flex-direction: row; justify-content: center; align-items: center; background-color: #21262d; }
        .radar-panel { grid-column: 1 / 2; grid-row: 2 / 3; }
        .wind-panel { grid-column: 2 / 3; grid-row: 2 / 3; }
        .forecast-panel { grid-column: 1 / 3; grid-row: 3 / 4; }
        .yr-panel { grid-column: 1 / 3; grid-row: 4 / 5; } /* Jaunais Yr.no bloks pašā apakšā */
        
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%; background-color: #161b22; border-top: 1px solid #30363d;
            display: flex; justify-content: space-between; align-items: center; height: 90px; padding: 0 15px; box-sizing: border-box; z-index: 9999; 
        }
        .bottom-nav a {
            text-decoration: none; flex: 1; text-align: center; margin: 0 10px; padding: 15px 0; background-color: #21262d;
            color: #c9d1d9; border-radius: 12px; font-size: 1.4rem; font-weight: bold; border: 2px solid #30363d; transition: all 0.2s;
        }
        .bottom-nav a:active { border-color: #58a6ff; background-color: #30363d; transform: scale(0.95); }
        .bottom-nav a.active { border-color: #58a6ff; color: #58a6ff; }
        .bottom-nav a.meteo-btn.active { border-color: #ff7b72; color: #ff7b72; }
    </style>
</head>
<body>
<div class="dashboard-container">
    
    <!-- 1. Pulksteņa rinda (Augšā) -->
    <div class="widget-box clock-bar">
        <span id="small-clock" style="font-size: 2.2rem; color: #58a6ff; font-weight: bold; font-family: monospace;">--:--:--</span>
        <span id="small-date" style="font-size: 1.2rem; color: #8b949e; margin-left: 20px;">...</span>
    </div>
    
    <!-- 2. Radars (Vidū pa kreisi, liels vertikāls) -->
    <div class="widget-box radar-panel">
        <h2>Radars un Nokrišņi</h2>
        <div style="flex-grow: 1; width: 100%; height: 100%;">
            <iframe src="https://embed.windy.com/embed.html?type=map&location=coordinates&metricRain=mm&metricTemp=°C&metricWind=km/h&zoom=7&overlay=rain&product=ecmwf&level=surface&lat=57.153&lon=24.854&marker=true" width="100%" height="100%" frameborder="0" style="border: 0;"></iframe>
        </div>
    </div>
    
    <!-- 3. Vējš (Vidū pa labi, liels vertikāls) -->
    <div class="widget-box wind-panel">
        <h2>Vēja Plūsmas</h2>
        <div style="flex-grow: 1; width: 100%; height: 100%;">
            <iframe src="https://embed.windy.com/embed.html?type=map&location=coordinates&metricRain=mm&metricTemp=°C&metricWind=km/h&zoom=7&overlay=wind&product=ecmwf&level=surface&lat=57.153&lon=24.854" width="100%" height="100%" frameborder="0" style="border: 0;"></iframe>
        </div>
    </div>

    <!-- 4. Windy Meteogramma (Pa visu platumu) -->
    <div class="widget-box forecast-panel">
        <h2>Windy Meteogramma (Sigulda)</h2>
        <div style="flex-grow: 1; width: 100%; height: 100%; background-color: #ffffff;">
            <iframe width="100%" height="100%" src="https://embed.windy.com/embed.html?type=forecast&location=coordinates&metricRain=mm&metricTemp=°C&metricWind=km/h&zoom=11&overlay=wind&product=ecmwf&level=surface&lat=57.153&lon=24.854&detailLat=57.153&detailLon=24.854&detail=true" frameborder="0" style="border:0;"></iframe>
        </div>
    </div>

    <!-- 5. Yr.no Norvēģu Laika Ziņas (Pa visu platumu apakšā) -->
    <div class="widget-box yr-panel">
        <h2>Norvēģu Laika Ziņas (Yr.no) - Sigulda</h2>
        <div style="flex-grow: 1; width: 100%; height: 100%; background-color: #161b22;">
            <!-- Izmantojam oficiālo Yr.no logrīku Siguldai (455718) tumšajā režīmā -->
            <iframe src="https://www.yr.no/en/content/2-455718/table.html?mode=dark" width="100%" height="100%" frameborder="0" style="border:0;"></iframe>
        </div>
    </div>
    
</div>

<div class="bottom-nav">
    <a href="index.html">📈 Finance</a>
    <a href="latvija.html">🇱🇻 Latvija</a>
    <a href="sigulda.html">⏱️ Sigulda</a>
    <a href="meteo.html" class="active meteo-btn">🌪️ METEO!</a>
</div>

<script>
    function updateClock() {
        const now = new Date();
        document.getElementById('small-clock').textContent = now.toLocaleTimeString('lv-LV', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        let dateString = now.toLocaleDateString('lv-LV', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        document.getElementById('small-date').textContent = dateString.charAt(0).toUpperCase() + dateString.slice(1);
    }
    setInterval(updateClock, 1000); updateClock();
</script>
</body>
</html>
