<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tirgus un Laika Informācijas Panelis</title>
    <style>
        /* Pamata iestatījumi un "tumšais režīms" (Dark Mode), lai nespīdētu acīs uz lielā ekrāna */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0d1117; /* GitHub dark tēmas fons */
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; /* Neļauj lapai "skrollēties" */
        }

        /* Galvenais konteiners ar CSS Grid, lai ērti izkārtotu elementus */
        .dashboard-container {
            display: grid;
            /* 3 kolonnas, divas vienādas, trešā - laikapstākļiem */
            grid-template-columns: 2fr 2fr 1fr; 
            /* 2 rindas: augšējā galvenā (lielāka), apakšējā mazāka */
            grid-template-rows: auto 1fr;
            /* Atstarpe starp logrīkiem */
            gap: 15px;
            padding: 15px;
            height: calc(100vh - 30px); /* 100% augstums mīnus padding */
            box-sizing: border-box;
        }

        /* Kopējais stils visiem paneļa "blokiem" */
        .widget-box {
            background-color: #161b22;
            border-radius: 10px;
            border: 1px solid #30363d;
            overflow: hidden; /* Neļauj saturam "izkāpt" ārpus rāmja */
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        
        .widget-box h2 {
            margin: 0;
            padding: 10px 15px;
            font-size: 1.2rem;
            border-bottom: 1px solid #30363d;
            background-color: #21262d;
            text-align: center;
        }

        /* Kurš elements kuru grid pozīciju ieņem */
        
        /* 1. rinda, 1. un 2. kolonna - Lielais grafiks */
        .main-chart { 
            grid-column: 1 / 3; 
            grid-row: 1 / 2;
            height: 60vh; /* Aizņem 60% no ekrāna augstuma */
        }
        
        /* 1. rinda, 3. kolonna - Laikapstākļi */
        .weather-panel { 
            grid-column: 3 / 4; 
            grid-row: 1 / 2;
        }

        /* 2. rinda, 1. kolonna - Zelta cena */
        .gold-chart {
            grid-column: 1 / 2;
            grid-row: 2 / 3;
        }

        /* 2. rinda, 2. un 3. kolonna - Papildus info (Ziņas, valūtas, u.c.) */
        .news-panel {
            grid-column: 2 / 4;
            grid-row: 2 / 3;
        }

        /* Konteiners pašam logrīkam iekš bloka, lai aizņem visu brīvo vietu */
        .tradingview-widget-container {
            flex-grow: 1;
            height: 100%;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="dashboard-container">

    <!-- 1. Galvenais grafiks (S&P 500) -->
    <div class="widget-box main-chart">
        <h2>S&P 500 & Global Markets</h2>
        <div class="tradingview-widget-container">
            <div class="tradingview-widget-container__widget" style="height:calc(100% - 32px); width:100%;"></div>
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
            {
            "autosize": true,
            "symbol": "FOREXCOM:SPXUSD",
            "interval": "D",
            "timezone": "Europe/Riga",
            "theme": "dark",
            "style": "1",
            "locale": "en",
            "enable_publishing": false,
            "backgroundColor": "#161b22",
            "gridColor": "#30363d",
            "hide_top_toolbar": false,
            "hide_legend": false,
            "save_image": false,
            "container_id": "tradingview_1"
            }
            </script>
        </div>
    </div>

    <!-- 2. Laikapstākļi (Sigulda) -->
    <div class="widget-box weather-panel">
        <h2>Laikapstākļi Siguldā</h2>
        <div style="flex-grow: 1; width: 100%; height: 100%; overflow: hidden;">
            <iframe src="https://www.meteoblue.com/lv/laikapstakli/widget/three/sigulda_latvija_455209?geoloc=fixed&nocurrent=0&noforecast=0&days=4&tempunit=CELSIUS&windunit=KILOMETER_PER_HOUR&layout=dark"  frameborder="0" scrolling="NO" allowtransparency="true" sandbox="allow-same-origin allow-scripts allow-popups allow-popups-to-escape-sandbox" style="width: 100%; height: 100%;"></iframe>
        </div>
    </div>

    <!-- 3. Zelta cena -->
    <div class="widget-box gold-chart">
        <h2>Zelts (XAU/USD)</h2>
        <div class="tradingview-widget-container">
            <div class="tradingview-widget-container__widget" style="height:calc(100% - 32px); width:100%;"></div>
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js" async>
            {
            "symbol": "OANDA:XAUUSD",
            "width": "100%",
            "height": "100%",
            "locale": "en",
            "dateRange": "1M",
            "colorTheme": "dark",
            "isTransparent": true,
            "autosize": true,
            "largeChartUrl": ""
            }
            </script>
        </div>
    </div>

    <!-- 4. Valūtas un Kripto vai Tirgus kopsavilkums -->
    <div class="widget-box news-panel">
        <h2>Tirgus Kopsavilkums (Ticker Tape)</h2>
        <div class="tradingview-widget-container">
            <div class="tradingview-widget-container__widget"></div>
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
            {
            "symbols": [
                { "proName": "FOREXCOM:SPXUSD", "title": "S&P 500 Index" },
                { "proName": "FOREXCOM:NSXUSD", "title": "US 100 Cash CFD" },
                { "proName": "FX_IDC:EURUSD", "title": "EUR to USD" },
                { "proName": "BITSTAMP:BTCUSD", "title": "Bitcoin" },
                { "proName": "BITSTAMP:ETHUSD", "title": "Ethereum" },
                { "description": "Apple", "proName": "NASDAQ:AAPL" },
                { "description": "Tesla", "proName": "NASDAQ:TSLA" }
            ],
            "showSymbolLogo": true,
            "isTransparent": true,
            "displayMode": "adaptive",
            "colorTheme": "dark",
            "locale": "en"
            }
            </script>
        </div>
    </div>

</div>

</body>
</html>
