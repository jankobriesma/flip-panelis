<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <!-- Pievienota lapas automātiskā pārlāde reizi stundā (3600 sek), lai neizkristu no Kiosk režīma -->
    <meta http-equiv="refresh" content="3600">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LATVIJAS PANELIS</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #0d1117; color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; 
        }

        .dashboard-container {
            display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr;
            gap: 15px; padding: 15px;
            height: calc(100vh - 110px); /* Pielāgots, lai atstātu vietu apakšējām pogām */
            box-sizing: border-box;
        }

        .widget-box {
            background-color: #161b22; border-radius: 10px; border: 1px solid #30363d;
            overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        
        .widget-box h2 {
            margin: 0; padding: 15px; font-size: 1.3rem; border-bottom: 1px solid #30363d;
            background-color: #21262d; display: flex; justify-content: space-between; align-items: center;
        }

        .news-panel { grid-column: 1 / 2; grid-row: 1 / 3; }
        .clock-panel { grid-column: 2 / 3; grid-row: 1 / 2; }
        .waze-panel { grid-column: 2 / 3; grid-row: 2 / 3; }
        
        .big-clock-container {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            height: 100%; background: linear-gradient(180deg, #161b22 0%, #0d1117 100%); padding-bottom: 20px;
        }
        .big-time {
            font-size: 5rem; font-weight: bold; color: #58a6ff; font-family: monospace;
            text-shadow: 0 0 10px rgba(88, 166, 255, 0.3); margin-top: 20px;
        }
        .big-date {
            font-size: 1.5rem; color: #8b949e; margin-top: 5px; margin-bottom: 30px;
        }

        /* --- Apakšējās navigācijas joslas dizains --- */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background-color: #161b22; border-top: 1px solid #30363d;
            display: flex; justify-content: space-between; align-items: center;
            height: 90px; padding: 0 15px; box-sizing: border-box; z-index: 9999; 
            box-shadow: 0 -5px 15px rgba(0,0,0,0.5);
        }
        
        .bottom-nav a {
            text-decoration: none; flex: 1; text-align: center; margin: 0 10px;
            padding: 15px 0; background-color: #21262d;
            color: #c9d1d9; border-radius: 12px; font-size: 1.4rem; font-weight: bold;
            border: 2px solid #30363d; transition: all 0.2s;
        }
        
        .bottom-nav a:active { border-color: #58a6ff; background-color: #30363d; transform: scale(0.95); }
        .bottom-nav a.active { border-color: #58a6ff; color: #58a6ff; }
        .bottom-nav a.meteo-btn.active { border-color: #ff7b72; color: #ff7b72; }
    </style>
</head>
<body>

<div class="dashboard-container">
    <div class="widget-box news-panel">
        <h2>
            <span>LATVIJAS ZIŅAS (Delfi)</span>
            <span style="color: #8b949e; font-size: 0.9rem;">Skrollējiet ar pirkstu</span>
        </h2>
        <div style="flex-grow: 1; width: 100%; height: 100%;">
            <iframe src="https://m.delfi.lv/" width="100%" height="100%" frameborder="0" style="border: 0; background-color: white;"></iframe>
        </div>
    </div>

    <div class="widget-box clock-panel">
        <div class="big-clock-container">
            <div class="big-time" id="big-clock">--:--:--</div>
            <div class="big-date" id="big-date">Ielādē datumu...</div>
            <div style="width: 95%; height: 220px; border-radius: 8px; overflow: hidden; border: 1px solid #30363d;">
                <iframe width="100%" height="100%" src="https://embed.windy.com/embed.html?type=forecast&location=coordinates&metricRain=mm&metricTemp=°C&metricWind=km/h&zoom=11&overlay=wind&product=ecmwf&level=surface&lat=57.153&lon=24.854&detailLat=57.153&detailLon=24.854&detail=true" frameborder="0" style="border:0;"></iframe>
            </div>
        </div>
    </div>

    <div class="widget-box waze-panel">
        <h2>Satiksme Reāllaikā (Sigulda - Rīga)</h2>
        <div style="flex-grow: 1; width: 100%; height: 100%;">
            <iframe src="https://embed.waze.com/iframe?zoom=10&lat=57.153&lon=24.854&ct=livemap&theme=dark" width="100%" height="100%" allowfullscreen style="border: 0;"></iframe>
        </div>
    </div>
</div>

<!-- Apakšējā izvēlne ērtākai pārslēgšanai (Latvija aktīva) -->
<div class="bottom-nav">
    <a href="index.html">📈 Volstrīta</a>
    <a href="latvija.html" class="active">🇱🇻 Latvija</a>
    <a href="sigulda.html">⏱️ Sigulda</a>
</div>

<script>
    function updateBigClock() {
        const now = new Date();
        document.getElementById('big-clock').textContent = now.toLocaleTimeString('lv-LV', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        let dateString = now.toLocaleDateString('lv-LV', options);
        dateString = dateString.charAt(0).toUpperCase() + dateString.slice(1);
        document.getElementById('big-date').textContent = dateString;
    }
    setInterval(updateBigClock, 1000);
    updateBigClock();
</script>
</body>
</html>
