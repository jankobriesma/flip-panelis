<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGULDAS PANELIS</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0d1117; 
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; 
        }

        .dashboard-container {
            display: grid;
            grid-template-columns: 1fr 1fr; 
            /* Mainām proporcijas: augšējā rinda (pulkstenis) tagad ir nedaudz mazāka par apakšējo (karte) */
            grid-template-rows: 0.8fr 1.2fr;
            gap: 15px;
            padding: 15px;
            height: calc(100vh - 30px);
            box-sizing: border-box;
        }

        .widget-box {
            background-color: #161b22;
            border-radius: 10px;
            border: 1px solid #30363d;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        
        .widget-box h2 {
            margin: 0;
            padding: 15px;
            font-size: 1.3rem;
            border-bottom: 1px solid #30363d;
            background-color: #21262d;
            display: flex;
            justify-content: space-between; 
            align-items: center;
        }

        .news-panel { grid-column: 1 / 2; grid-row: 1 / 3; }
        .clock-panel { grid-column: 2 / 3; grid-row: 1 / 2; }
        .map-panel { grid-column: 2 / 3; grid-row: 2 / 3; }
        
        /* Pulksteņa kastes izkārtojums */
        .clock-container {
            display: flex;
            flex-direction: row; /* Analogais pa kreisi, prognoze pa labi */
            justify-content: space-around;
            align-items: center;
            height: 100%;
            padding: 10px;
            background: linear-gradient(180deg, #161b22 0%, #0d1117 100%);
        }

        /* --- Analogais Pulkstenis --- */
        .analog-clock {
            position: relative;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background-color: #0d1117;
            border: 8px solid #30363d;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 0 15px rgba(88, 166, 255, 0.2);
        }

        /* Centrālais punkts */
        .analog-clock::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 16px;
            height: 16px;
            background-color: #58a6ff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        /* Rādītāji */
        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom;
            border-radius: 4px;
            z-index: 5;
        }

        .hour-hand {
            width: 8px;
            height: 70px;
            background-color: #c9d1d9;
            transform: translateX(-50%);
        }

        .minute-hand {
            width: 6px;
            height: 100px;
            background-color: #8b949e;
            transform: translateX(-50%);
        }

        .second-hand {
            width: 2px;
            height: 110px;
            background-color: #ff7b72; /* Sarkana sekunžu bultiņa */
            transform: translateX(-50%);
            z-index: 8; /* Virs minūtēm, zem centra */
        }
        
        /* Cipari (stundu atzīmes) - vienkāršoti marķieri */
        .clock-marks {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        .mark {
            position: absolute;
            width: 4px;
            height: 15px;
            background-color: #484f58;
            top: 5px;
            left: calc(50% - 2px);
            transform-origin: 50% 120px; /* 120px ir rādiuss (250/2 - atstarpe) */
        }
        /* Iestatām 12 marķieru leņķus */
        .mark:nth-child(1) { transform: rotate(30deg); }
        .mark:nth-child(2) { transform: rotate(60deg); }
        .mark:nth-child(3) { transform: rotate(90deg); height: 20px; background-color: #8b949e; } /* 3, 6, 9, 12 lielāki */
        .mark:nth-child(4) { transform: rotate(120deg); }
        .mark:nth-child(5) { transform: rotate(150deg); }
        .mark:nth-child(6) { transform: rotate(180deg); height: 20px; background-color: #8b949e; }
        .mark:nth-child(7) { transform: rotate(210deg); }
        .mark:nth-child(8) { transform: rotate(240deg); }
        .mark:nth-child(9) { transform: rotate(270deg); height: 20px; background-color: #8b949e; }
        .mark:nth-child(10) { transform: rotate(300deg); }
        .mark:nth-child(11) { transform: rotate(330deg); }
        .mark:nth-child(12) { transform: rotate(0deg); height: 20px; background-color: #58a6ff; } /* 12 izcelts ar zilu */


    </style>
</head>
<body>

<div class="dashboard-container">

    <!-- 1. Delfi Ziņas -->
    <div class="widget-box news-panel">
        <h2>
            <span>LATVIJAS ZIŅAS (Delfi)</span>
        </h2>
        <div style="flex-grow: 1; width: 100%; height: 100%;">
            <iframe src="https://m.delfi.lv/" width="100%" height="100%" frameborder="0" style="border: 0; background-color: white;"></iframe>
        </div>
    </div>

    <!-- 2. Analogais Pulkstenis un Windy Grafiks -->
    <div class="widget-box clock-panel">
        <div class="clock-container">
            <!-- Analogais pulkstenis pa kreisi -->
            <div class="analog-clock">
                <div class="clock-marks">
                    <div class="mark"></div><div class="mark"></div><div class="mark"></div>
                    <div class="mark"></div><div class="mark"></div><div class="mark"></div>
                    <div class="mark"></div><div class="mark"></div><div class="mark"></div>
                    <div class="mark"></div><div class="mark"></div><div class="mark"></div>
                </div>
                <div class="hand hour-hand" id="hour-hand"></div>
                <div class="hand minute-hand" id="minute-hand"></div>
                <div class="hand second-hand" id="second-hand"></div>
            </div>
            
            <!-- Windy prognozes grafiks pa labi -->
            <div style="width: 55%; height: 220px; border-radius: 8px; overflow: hidden; border: 1px solid #30363d;">
                <iframe width="100%" height="100%" src="https://embed.windy.com/embed.html?type=forecast&location=coordinates&metricRain=mm&metricTemp=°C&metricWind=km/h&zoom=11&overlay=wind&product=ecmwf&level=surface&lat=57.153&lon=24.854&detailLat=57.153&detailLon=24.854&detail=true" frameborder="0" style="border:0;"></iframe>
            </div>
        </div>
    </div>

    <!-- 3. Windy Interaktīvā Karte (Meteo) apakšā -->
    <div class="widget-box map-panel">
        <h2>Laikapstākļu Karte (Lietus un Radars)</h2>
        <div style="flex-grow: 1; width: 100%; height: 100%;">
            <!-- Šeit ir Windy lietus un pērkona (rain) pārklājums centrēts uz Latviju -->
            <iframe src="https://embed.windy.com/embed.html?type=map&location=coordinates&metricRain=mm&metricTemp=°C&metricWind=km/h&zoom=7&overlay=rain&product=ecmwf&level=surface&lat=56.9&lon=24.5&detailLat=57.153&detailLon=24.854&marker=true" width="100%" height="100%" frameborder="0" style="border: 0;"></iframe>
        </div>
    </div>

</div>

<script>
    // Analogā pulksteņa animācija
    function setClock() {
        const now = new Date();
        
        // Aprēķinām leņķus (grādus) katrai bultiņai
        // Pieskaitām sekundes un minūtes, lai bultiņas kustētos plūstoši, nevis lēkātu
        const seconds = now.getSeconds();
        const minutes = now.getMinutes();
        const hours = now.getHours();

        const secondsDegrees = (seconds / 60) * 360;
        const minutesDegrees = ((minutes + seconds / 60) / 60) * 360;
        const hoursDegrees = ((hours % 12 + minutes / 60) / 12) * 360;

        // Pielietojam rotāciju (css transform)
        // 'translateX(-50%)' jāsaglabā, jo tas centrē bultiņu pirms rotācijas, kā definēts CSS
        document.getElementById('second-hand').style.transform = `translateX(-50%) rotate(${secondsDegrees}deg)`;
        document.getElementById('minute-hand').style.transform = `translateX(-50%) rotate(${minutesDegrees}deg)`;
        document.getElementById('hour-hand').style.transform = `translateX(-50%) rotate(${hoursDegrees}deg)`;
    }

    // Atjaunojam reizi sekundē
    setInterval(setClock, 1000);
    setClock();
</script>

</body>
</html>
