<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <!-- Pievienota lapas automātiskā pārlāde reizi stundā -->
    <meta http-equiv="refresh" content="3600">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGULDAS PANELIS</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #0d1117; color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; 
        }

        .dashboard-container {
            display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 0.8fr 1.2fr;
            gap: 15px; padding: 15px; height: calc(100vh - 110px); box-sizing: border-box;
        }

        .widget-box {
            background-color: #161b22; border-radius: 10px; border: 1px solid #30363d;
            overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        
        .widget-box h2 {
            margin: 0; padding: 15px; font-size: 1.3rem; border-bottom: 1px solid #30363d;
            background-color: #21262d; display: flex; justify-content: space-between; align-items: center;
        }

        .news-panel { grid-column: 1 / 2; grid-row: 1 / 3; }
        .clock-panel { grid-column: 2 / 3; grid-row: 1 / 2; }
        .map-panel { grid-column: 2 / 3; grid-row: 2 / 3; }
        
        .clock-container {
            display: flex; flex-direction: row; justify-content: space-around; align-items: center;
            height: 100%; padding: 10px; background: linear-gradient(180deg, #161b22 0%, #0d1117 100%);
        }

        /* --- Analogais Pulkstenis --- */
        .analog-clock {
            position: relative; width: 250px; height: 250px; border-radius: 50%;
            background-color: #0d1117; border: 8px solid #30363d;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 0 15px rgba(88, 166, 255, 0.2);
        }
        .analog-clock::after {
            content: ''; position: absolute; top: 50%; left: 50%; width: 16px; height: 16px;
            background-color: #58a6ff; border-radius: 50%; transform: translate(-50%, -50%); z-index: 10;
        }
        .hand { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom; border-radius: 4px; z-index: 5; }
        .hour-hand { width: 8px; height: 70px; background-color: #c9d1d9; transform: translateX(-50%); }
        .minute-hand { width: 6px; height: 100px; background-color: #8b949e; transform: translateX(-50%); }
        .second-hand { width: 2px; height: 110px; background-color: #ff7b72; transform: translateX(-50%); z-index: 8; }
        
        .clock-marks { position: absolute; width: 100%; height: 100%; }
        .mark { position: absolute; width: 4px; height: 15px; background-color: #484f58; top: 5px; left: calc(50% - 2px); transform-origin: 50% 120px; }
        .mark:nth-child(1) { transform: rotate(30deg); } .mark:nth-child(2) { transform: rotate(60deg); } .mark:nth-child(3) { transform: rotate(90deg); height: 20px; background-color: #8b949e; }
        .mark:nth-child(4) { transform: rotate(120deg); } .mark:nth-child(5) { transform: rotate(150deg); } .mark:nth-child(6) { transform: rotate(180deg); height: 20px; background-color: #8b949e; }
        .mark:nth-child(7) { transform: rotate(210deg); } .mark:nth-child(8) { transform: rotate(240deg); } .mark:nth-child(9) { transform: rotate(270deg); height: 20px; background-color: #8b949e; }
        .mark:nth-child(10) { transform: rotate(300deg); } .mark:nth-child(11) { transform: rotate(330deg); } .mark:nth-child(12) { transform: rotate(0deg); height: 20px; background-color: #58a6ff; }

        /* --- Apakšējās navigācijas joslas dizains --- */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background-color: #161b22; border-top: 1px solid #30363d;
            display: flex; justify-content: space-between; align-items: center;
            height: 90px; padding: 0 15px; box-sizing: border-box; z-index: 9999; 
            box-shadow: 0 -5px 15px rgba(0,0,0,0.5);
        }
        
        .bottom-nav a {
            text-decoration: none; flex: 1; text-align: center; margin: 0 10px;
            padding: 15px 0; background-color: #21262d;
            color: #c9d1d9; border-radius: 12px; font-size: 1.4rem; font-weight: bold;
            border: 2px solid #30363d; transition: all 0.2s;
        }
        
        .bottom-nav a:active { border-color: #58a6ff; background-color: #30363d; transform: scale(0.95); }
        .bottom-nav a.active { border-color: #58a6ff; color: #58a6ff; }
        .bottom-nav a.meteo-btn.active { border-color: #ff7b72; color: #ff7b72; }
    </style>
</head>
<body>

<div class="dashboard-container">
    <div class="widget-box news-panel">
        <h2><span>LATVIJAS ZIŅAS (Delfi)</span></h2>
        <div style="flex-grow: 1; width: 100%; height: 100%;">
            <iframe src="https://m.delfi.lv/" width="100%" height="100%" frameborder="0" style="border: 0; background-color: white;"></iframe>
        </div>
    </div>

    <div class="widget-box clock-panel">
        <div class="clock-container">
            <div class="analog-clock">
                <div class="clock-marks">
                    <div class="mark"></div><div class="mark"></div><div class="mark"></div><div class="mark"></div><div class="mark"></div><div class="mark"></div>
                    <div class="mark"></div><div class="mark"></div><div class="mark"></div><div class="mark"></div><div class="mark"></div><div class="mark"></div>
                </div>
                <div class="hand hour-hand" id="hour-hand"></div>
                <div class="hand minute-hand" id="minute-hand"></div>
                <div class="hand second-hand" id="second-hand"></div>
            </div>
            
            <div style="width: 55%; height: 220px; border-radius: 8px; overflow: hidden; border: 1px solid #30363d;">
                <iframe width="100%" height="100%" src="https://embed.windy.com/embed.html?type=forecast&location=coordinates&metricRain=mm&metricTemp=°C&metricWind=km/h&zoom=11&overlay=wind&product=ecmwf&level=surface&lat=57.153&lon=24.854&detailLat=57.153&detailLon=24.854&detail=true" frameborder="0" style="border:0;"></iframe>
            </div>
        </div>
    </div>

    <div class="widget-box map-panel">
        <h2>Laikapstākļu Karte (Lietus un Radars)</h2>
        <div style="flex-grow: 1; width: 100%; height: 100%;">
            <iframe src="https://embed.windy.com/embed.html?type=map&location=coordinates&metricRain=mm&metricTemp=°C&metricWind=km/h&zoom=7&overlay=rain&product=ecmwf&level=surface&lat=56.9&lon=24.5&detailLat=57.153&detailLon=24.854&marker=true" width="100%" height="100%" frameborder="0" style="border: 0;"></iframe>
        </div>
    </div>
</div>

<!-- Apakšējā izvēlne ērtākai pārslēgšanai (Sigulda aktīva) -->
<div class="bottom-nav">
    <a href="index.html">📈 Volstrīta</a>
    <a href="latvija.html">🇱🇻 Latvija</a>
    <a href="sigulda.html" class="active">⏱️ Sigulda</a>
</div>

<script>
    function setClock() {
        const now = new Date();
        const seconds = now.getSeconds();
        const minutes = now.getMinutes();
        const hours = now.getHours();

        const secondsDegrees = (seconds / 60) * 360;
        const minutesDegrees = ((minutes + seconds / 60) / 60) * 360;
        const hoursDegrees = ((hours % 12 + minutes / 60) / 12) * 360;

        document.getElementById('second-hand').style.transform = `translateX(-50%) rotate(${secondsDegrees}deg)`;
        document.getElementById('minute-hand').style.transform = `translateX(-50%) rotate(${minutesDegrees}deg)`;
        document.getElementById('hour-hand').style.transform = `translateX(-50%) rotate(${hoursDegrees}deg)`;
    }
    setInterval(setClock, 1000);
    setClock();
</script>
</body>
</html>
